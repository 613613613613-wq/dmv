# XcodeGen config — generates DMVPrep.xcodeproj from this file plus Sources/, App/, ContentPacks/.
# Install: brew install xcodegen
# Generate: xcodegen
#
# Each state ships as its own App Store SKU (separate bundle ID, listing, ASO).
# Internally they're the same binary with a different bundled JSON pack and a different
# STATE_CODE. To add a state: copy the Florida block, change PRODUCT_BUNDLE_IDENTIFIER,
# DISPLAY_NAME, STATE_CODE, and the bundled content pack path.

name: DMVPrep
options:
  bundleIdPrefix: com.shlomo.dmvprep
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  DMVEngine:
    path: .
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    from: 7.0.0

targets:
  Florida:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ContentPacks/fl.json
        buildPhase: resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Florida Permit Test
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        STATE_CODE: FL
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: DMVEngine
      - package: GRDB
        product: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shlomo.dmvprep.fl
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # Texas (sample — uncomment when content pack ready):
  # Texas:
  #   type: application
  #   platform: iOS
  #   sources:
  #     - path: App
  #     - path: ContentPacks/texas.json
  #       buildPhase: resources
  #   info:
  #     path: App/Resources/Info.plist
  #     properties:
  #       CFBundleDisplayName: Texas Permit Test
  #       CFBundleShortVersionString: "1.0.0"
  #       CFBundleVersion: "1"
  #       STATE_CODE: TX
  #       UILaunchScreen: {}
  #   dependencies:
  #     - package: DMVEngine
  #     - package: GRDB
  #       product: GRDB
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: com.shlomo.dmvprep.tx
  #       TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  Florida:
    build:
      targets:
        Florida: all
    run:
      config: Debug
    archive:
      config: Release
