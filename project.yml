# XcodeGen config — generates DMVPrep.xcodeproj from this file plus the Sources/, App/, ContentPacks/ trees.
# Install: brew install xcodegen
# Generate: xcodegen
#
# Each state ships as its own App Store SKU (separate bundle ID, separate listing, separate ASO).
# All states share the same engine and the same SwiftUI app shell — only the bundled content pack,
# bundle ID, display name, and accent color change per scheme.
#
# To add a new state:
#   1. Drop the content pack JSON into ContentPacks/<state>.json
#   2. Add a target below following the Florida example
#   3. Add an entry to the schemes section
#   4. Re-run `xcodegen`

name: DMVPrep
options:
  bundleIdPrefix: com.shlomo.dmvprep
  deploymentTarget:
    iOS: "17.0"
  defaultConfig: Debug

settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: en
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO

packages:
  DMVEngine:
    path: .

# ---- Reusable target template -------------------------------------------------
# Each state target inherits from this, overrides STATE_CODE / display name / pack.
targetTemplates:
  StateApp:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: ContentPacks
        type: folder
        buildPhase: resources
        # filter at build time: only this state's pack ships in this binary
        # (XcodeGen alone can't conditionally include — see BUILD.md for the per-target shell script
        # that prunes ContentPacks/ to a single file before the resources phase runs)
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: ${DISPLAY_NAME}
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        STATE_CODE: ${STATE_CODE}
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: DMVEngine
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"

# ---- Per-state targets --------------------------------------------------------
targets:
  Florida:
    template: StateApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shlomo.dmvprep.fl
        DISPLAY_NAME: "Florida Permit Test"
        STATE_CODE: "FL"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # When ready to ship Texas:
  # Texas:
  #   template: StateApp
  #   settings:
  #     base:
  #       PRODUCT_BUNDLE_IDENTIFIER: com.shlomo.dmvprep.tx
  #       DISPLAY_NAME: "Texas Permit Test"
  #       STATE_CODE: "TX"

schemes:
  Florida:
    build:
      targets:
        Florida: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - DMVEngineTests
    archive:
      config: Release
