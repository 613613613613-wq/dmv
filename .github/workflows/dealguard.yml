name: dealguard

on:
  push:
    paths:
      - "dealguard/**"
      - ".github/workflows/dealguard.yml"
  pull_request:
    paths:
      - "dealguard/**"
      - ".github/workflows/dealguard.yml"

concurrency:
  group: dealguard-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: dealguard

env:
  # RevenueCat public SDK keys are optional; empty disables purchasing in the built bundle.
  VITE_RC_IOS_KEY: ${{ secrets.VITE_RC_IOS_KEY }}
  VITE_RC_ANDROID_KEY: ${{ secrets.VITE_RC_ANDROID_KEY }}

jobs:
  web:
    name: Web (typecheck, unit, build, e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dealguard/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build web bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            dealguard/playwright-report
            dealguard/test-results
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Android (debug APK, release AAB)
    runs-on: ubuntu-latest
    needs: web
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dealguard/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Android SDK is preinstalled on ubuntu-latest; cache Gradle only.
      - uses: gradle/actions/setup-gradle@v4

      - name: Install and build web bundle
        run: npm ci && npm run build

      - name: Capacitor sync (android)
        run: npx cap sync android

      - name: Gradle build
        working-directory: dealguard/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: dealguard-debug-apk
          path: dealguard/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload unsigned release AAB
        uses: actions/upload-artifact@v4
        with:
          name: dealguard-release-aab-unsigned
          path: dealguard/android/app/build/outputs/bundle/release/*.aab
          retention-days: 14

  ios:
    name: iOS (simulator build)
    runs-on: macos-15
    needs: web
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dealguard/package-lock.json

      - name: Install and build web bundle
        run: npm ci && npm run build

      - name: Capacitor sync (ios)
        run: npx cap sync ios

      - name: Xcode build (simulator, no signing)
        working-directory: dealguard/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build
